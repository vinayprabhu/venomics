name: Apply scientific review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified scientific corrections
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          payload=json.loads(zlib.decompress(base64.b64decode('')))
          files=payload['files']
          for name, record in files.items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts, name
              current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert current==record['before'], f'Concurrent edit detected: {name}'
          patch=payload['patch'].encode('utf-8')
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name, record in files.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==record['after'], name
          print(f'Applied {len(files)} verified source changes.')
          PY
      - name: Verify source and narration
        run: |
          for file in *.js; do node --check "$file"; done
          python scripts/check_science.py
          node scripts/check_audio.mjs
          python scripts/package_site.py
          git diff --check
      - name: Commit reviewed changes and remove one-time updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/scientific-review.yml
          git add --all
          git commit -m "Correct treatment routes, structural context, and stage narration"
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish corrected website
        id: deployment
        uses: actions/deploy-pages@v4
