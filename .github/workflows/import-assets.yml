name: Import website assets once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Import and verify public assets
        run: python scripts/import_assets.py
      - name: Validate complete website
        run: |
          for file in *.js; do node --check "$file"; done
          python scripts/package_site.py
      - name: Commit self-contained website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data media narration
          git rm scripts/import_assets.py .github/workflows/import-assets.yml
          git commit -m "Import verified 3D assets, molecular data, audio, and narration"
          git push origin HEAD:main
